<title>Busca — Jornada do Cliente</title>
<style>
  :root{
    --bg: #ffffff;
    --surface: #ffffff;
    --card: #fbfaf7;
    --ink: #2b2b26;
    --ink-soft: #8a8680;
    --line: #ebe8e1;
    --accent: #2f6f5e;
    --accent-soft: #eaf3f0;
    --danger: #b3492f;
    --danger-soft: #fbeae4;
    --toast-bg: #2b2b26;
    --toast-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #191919;
      --surface: #232323;
      --card: #202020;
      --ink: #e9e6e0;
      --ink-soft: #928d84;
      --line: #333230;
      --accent: #4fae96;
      --accent-soft: #1d3330;
      --danger: #e0755a;
      --danger-soft: #3a2420;
      --toast-bg: #e9e6e0;
      --toast-ink: #191919;
    }
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px 18px;
  }
  .wrap{ max-width: 580px; margin: 0 auto; }

  .top-row{
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .search-box{ position: relative; flex: 1; }
  .search-box input{
    width: 100%;
    padding: 13px 16px 13px 40px;
    font-size: 15px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .search-box input:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search-icon{
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--ink-soft);
    pointer-events: none;
  }
  .edit-toggle{
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    font-size: 16px;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .edit-toggle:hover{ background: var(--accent-soft); }
  .edit-toggle.active{ background: var(--accent); border-color: var(--accent); }

  /* ---------- modo busca ---------- */
  .results{ margin-top: 6px; }
  .result-link{
    display: block;
    padding: 10px 14px;
    border-radius: 8px;
    text-decoration: none;
    color: var(--ink);
    transition: background .12s ease;
  }
  .result-link:hover{ background: var(--accent-soft); }
  .result-title{
    font-size: 14.5px;
    font-weight: 600;
  }
  .result-title mark{ background: #fff2cf; color: #2b2b26; border-radius: 3px; padding: 0 1px; }
  .result-summary{
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .empty{ padding: 14px; color: var(--ink-soft); font-size: 13.5px; }
  .fuzzy-note{
    font-size: 12px;
    color: var(--ink-soft);
    padding: 4px 14px 8px;
    font-style: italic;
  }

  /* ---------- modo edição ---------- */
  #editPanel{ display: none; margin-top: 14px; }
  #editPanel.show{ display: block; }
  .edit-hint{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .edit-card{
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    background: var(--card);
  }
  .field{ margin-bottom: 8px; }
  .field label{
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: .03em;
    margin-bottom: 3px;
  }
  .field input, .field textarea{
    width: 100%;
    font-family: inherit;
    font-size: 13.5px;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 6px;
    outline: none;
    background: var(--surface);
    color: var(--ink);
    resize: none;
  }
  .field input:focus, .field textarea:focus{ border-color: var(--accent); }
  .edit-card-bottom{ display: flex; justify-content: flex-end; margin-top: 6px; }
  .remove-btn{
    font-size: 12px;
    color: var(--danger);
    background: var(--danger-soft);
    border: none;
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .remove-btn:hover{ opacity: .8; }

  .add-btn{
    width: 100%;
    padding: 11px;
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .add-btn:hover{ background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  .save-row{
    display: flex;
    gap: 8px;
    position: sticky;
    bottom: 0;
    background: var(--bg);
    padding: 10px 0 2px;
  }
  .save-btn, .done-btn{
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .save-btn{ background: var(--accent); color: #fff; }
  .save-btn:hover{ opacity: .9; }
  .done-btn{ background: var(--surface); color: var(--ink-soft); border: 1.5px solid var(--line); }
  .done-btn:hover{ background: var(--accent-soft); }

  .toast{
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--toast-bg);
    color: var(--toast-ink);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .toast.show{ opacity: 1; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top-row">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="searchInput" type="text" placeholder="Buscar material..." autocomplete="off">
    </div>
    <button class="edit-toggle" id="editToggle" title="Modo edição">✏️</button>
  </div>

  <div class="results" id="results"></div>

  <div id="editPanel">
    <div class="edit-hint">Edite, adicione ou remova materiais abaixo. Ao terminar, clique em <b>"Baixar arquivo atualizado"</b> e suba esse novo arquivo no lugar do antigo — sem precisar programar nada.</div>
    <div id="editList"></div>
    <button class="add-btn" id="addBtn">+ Adicionar material</button>
    <div class="save-row">
      <button class="done-btn" id="doneBtn">Voltar para a busca</button>
      <button class="save-btn" id="downloadBtn">⬇️ Baixar arquivo atualizado</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

    "keywords": "tutorial, alinhamento, treinamento, onboarding"
  },
  {
    "title": "Ferramentas Facilitadoras",
    "url": "https://app.notion.com/p/6c7aabaad8a582bcb571815d802ddecb",
    "summary": "Ferramentas internas que apoiam o atendimento, como Retool e calculadoras.",
    "keywords": "ferramentas, retool, calculadora, ferramentas internas"
  },
  {
    "title": "Outros assuntos",
    "url": "https://app.notion.com/p/8f7aabaad8a582b9812001af44035066",
    "summary": "Assuntos diversos que não se encaixam nas demais categorias.",
    "keywords": "outros assuntos, diversos, testes"
  }
]
</script>

<script id="appScript">
let DOCS = JSON.parse(document.getElementById('docs-data').textContent);

const input = document.getElementById('searchInput');
const resultsEl = document.getElementById('results');
const editToggle = document.getElementById('editToggle');
const editPanel = document.getElementById('editPanel');
const editList = document.getElementById('editList');
const toast = document.getElementById('toast');

function norm(s){
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

// Palavras muito comuns em português que não ajudam a diferenciar o tema buscado.
const STOPWORDS = new Set(['de','da','do','das','dos','e','o','a','os','as','um','uma','uns','umas',
  'para','com','sem','no','na','nos','nas','que','meu','minha','seus','suas','seu','sua','foi','so',
  'isso','isto','aquilo','sobre','por','como','ao','aos','em','se','ou','ja','tem','ter','vou','quero',
  'quer','preciso','precisa','onde','qual','quais','pelo','pela','este','esta','esse','essa','ainda']);

function tokenize(text){
  return norm(text).split(/[^a-z0-9]+/).filter(w => w.length > 1 && !STOPWORDS.has(w));
}

// Raiz aproximada da palavra (corta em 5 letras) — agrupa variações como
// "faleceu / falecimento / falecido" ou "revogar / revogação / revogado".
function stem(w){
  return w.length > 5 ? w.slice(0, 5) : w;
}

// Distância de edição simples, para tolerar pequenos erros de digitação.
function levenshtein(a, b){
  if(Math.abs(a.length - b.length) > 2) return 99;
  const dp = [];
  for(let i = 0; i <= a.length; i++) dp.push([i]);
  for(let j = 1; j <= b.length; j++) dp[0][j] = j;
  for(let i = 1; i <= a.length; i++){
    for(let j = 1; j <= b.length; j++){
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[a.length][b.length];
}

function keywordList(doc){
  return (doc.keywords || '').split(',').map(k => k.trim()).filter(Boolean);
}

// Todas as palavras (título + resumo + palavras-chave) do material, usadas
// para a correspondência aproximada palavra a palavra.
function docBag(doc){
  const kws = keywordList(doc);
  const allText = [doc.title || '', ...kws, doc.summary || ''].join(' ');
  return tokenize(allText);
}

function score(doc, q){
  const nq = norm(q);
  const qTokens = tokenize(q);
  if(qTokens.length === 0) return 0;

  let s = 0;

  // Sinal forte: a frase digitada bate quase literalmente com o título/palavra-chave/resumo.
  if(norm(doc.title).includes(nq)) s += 50;
  keywordList(doc).forEach(k => {
    const nk = norm(k);
    if(nk === nq) s += 60;
    else if(nk.includes(nq) || nq.includes(nk)) s += 30;
  });
  if(norm(doc.summary).includes(nq)) s += 10;

  // Sinal aproximado: cada palavra da busca é comparada com todas as palavras
  // do material (raiz da palavra, substring ou erro de digitação pequeno).
  const bag = docBag(doc);
  const bagStems = bag.map(stem);
  let tokenHits = 0;
  qTokens.forEach(qt => {
    const qs = stem(qt);
    let hit = 0;
    for(let i = 0; i < bag.length; i++){
      const w = bag[i];
      if(w === qt){ hit = 1; break; }
      if(bagStems[i] === qs){ hit = Math.max(hit, 0.85); continue; }
      if(w.includes(qt) || qt.includes(w)){ hit = Math.max(hit, 0.6); continue; }
      if(levenshtein(qt, w) <= (qt.length > 5 ? 2 : 1)){ hit = Math.max(hit, 0.5); }
    }
    tokenHits += hit;
  });
  s += (tokenHits / qTokens.length) * 20;

  return s;
}

function highlight(text, q){
  const nq = norm(q);
  const nText = norm(text || '');
  const idx = nText.indexOf(nq);
  if(idx === -1 || !nq) return text || '';
  return (text || '').slice(0, idx) + '<mark>' + (text || '').slice(idx, idx + q.length) + '</mark>' + (text || '').slice(idx + q.length);
}

function renderResults(){
  const q = input.value.trim();

  if(!q){
    resultsEl.innerHTML = '';
    return;
  }

  const list = DOCS.map(d => ({ doc: d, s: score(d, q) }))
    .filter(x => x.s > 2)
    .sort((a,b) => b.s - a.s)
    .slice(0, 8);

  if(list.length === 0){
    resultsEl.innerHTML = `<div class="empty">Nada encontrado para "${q}". Tente outras palavras.</div>`;
    return;
  }

  // Se não houve nenhuma correspondência quase literal, avisa que são resultados aproximados.
  const isFuzzyOnly = list[0].s < 20;
  const note = isFuzzyOnly ? `<div class="fuzzy-note">Nenhum resultado exato — o mais parecido com "${q}":</div>` : '';

  resultsEl.innerHTML = note + list.map(({doc}) => `
    <a class="result-link" href="${doc.url}" target="_blank" rel="noopener">
      <div class="result-title">${highlight(doc.title, q)}</div>
      <div class="result-summary">${doc.summary || ''}</div>
    </a>
  `).join('');
}

input.addEventListener('input', renderResults);

// ---------- modo edição ----------
function renderEditList(){
  editList.innerHTML = DOCS.map((doc, i) => `
    <div class="edit-card" data-index="${i}">
      <div class="field">
        <label>Título</label>
        <input type="text" data-field="title" value="${(doc.title || '').replace(/"/g,'&quot;')}">
      </div>
      <div class="field">
        <label>Resumo (uma linha)</label>
        <input type="text" data-field="summary" value="${(doc.summary || '').replace(/"/g,'&quot;')}">
      </div>
      <div class="field">
        <label>Link do material (Notion)</label>
        <input type="text" data-field="url" value="${(doc.url || '').replace(/"/g,'&quot;')}">
      </div>
      <div class="field">
        <label>Palavras-chave (separadas por vírgula)</label>
        <textarea rows="2" data-field="keywords">${doc.keywords || ''}</textarea>
      </div>
      <div class="edit-card-bottom">
        <button class="remove-btn" data-remove="${i}">Remover material</button>
      </div>
    </div>
  `).join('');

  editList.querySelectorAll('.edit-card').forEach(card => {
    const idx = Number(card.dataset.index);
    card.querySelectorAll('[data-field]').forEach(fieldEl => {
      fieldEl.addEventListener('input', () => {
        DOCS[idx][fieldEl.dataset.field] = fieldEl.value;
      });
    });
  });

  editList.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.remove);
      DOCS.splice(idx, 1);
      renderEditList();
    });
  });
}

editToggle.addEventListener('click', () => {
  const showing = editPanel.classList.toggle('show');
  editToggle.classList.toggle('active', showing);
  resultsEl.style.display = showing ? 'none' : '';
  if(showing) renderEditList();
});

document.getElementById('doneBtn').addEventListener('click', () => {
  editPanel.classList.remove('show');
  editToggle.classList.remove('active');
  resultsEl.style.display = '';
});

document.getElementById('addBtn').addEventListener('click', () => {
  DOCS.push({ title: '', summary: '', url: '', keywords: '' });
  renderEditList();
  editList.lastElementChild.querySelector('input[data-field="title"]').focus();
});

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

document.getElementById('downloadBtn').addEventListener('click', () => {
  const cleanDocs = DOCS.filter(d => d.title && d.url);
  const scriptEl = document.getElementById('appScript');

  const clone = document.documentElement.cloneNode(true);
  clone.querySelector('#docs-data').textContent = '\n' + JSON.stringify(cleanDocs, null, 2) + '\n';
  clone.querySelector('#editPanel').classList.remove('show');
  clone.querySelector('#editToggle').classList.remove('active');
  clone.querySelector('#results').removeAttribute('style');
  clone.querySelector('#searchInput').removeAttribute('value');
  // garante que a lógica do app no arquivo exportado é idêntica à desta página
  clone.querySelector('#appScript').textContent = scriptEl.textContent;

  const html = '<!DOCTYPE html>\n' + clone.outerHTML;
  const blob = new Blob([html], { type: 'text/html' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'busca-jornada-cliente.html';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  showToast('Arquivo baixado — suba ele no lugar do antigo.');
});
</script>
</body>
</html>
